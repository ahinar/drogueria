{% extends "base.html" %}
{% block titulo %}Kardex{% endblock %}
{% block contenido %}
<h1><span class="ico-emoji">📋</span> Kardex por producto</h1>
<p class="suave">Busca un producto para ver su historial de movimientos.</p>

<form method="get" class="filtros">
  <input type="text" id="buscar-kardex" placeholder="Escribe el nombre, código o escanea…" style="flex:1;padding:.5rem">
  <div id="resultados-kardex" class="panel-resultados-oculto" style="position:absolute;z-index:100;max-width:600px"></div>
</form>
<p class="suave">O si prefieres, ve a un producto desde la <a href="{{ url_for('productos.lista') }}">lista de productos</a> y usa el botón "Kardex".</p>

<script src="{{ url_for('static', filename='js/kardex_buscar.js') }}"></script>
{% endblock %}
