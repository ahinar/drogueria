{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="tarjeta angosta">
  <h1>Cambiar contraseña</h1>
  <p>Usuario: <strong>{{ objetivo.usuario }}</strong> ({{ objetivo.nombre }})</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Contraseña nueva (mínimo 8 caracteres)
      <input type="password" name="nueva" autocomplete="new-password" required autofocus>
    </label>
    <label>Repite la contraseña nueva
      <input type="password" name="confirmar" autocomplete="new-password" required>
    </label>
    <button type="submit" class="btn">Guardar</button>
    <a href="{{ url_for('admin.usuarios') }}" class="btn-link">Cancelar</a>
  </form>
</div>
{% endblock %}
