{% extends "base.html" %}
{% block titulo %}{{ 'Editar gasto' if gasto else 'Nuevo gasto' }}{% endblock %}
{% block contenido %}
<h1>{{ 'Editar gasto' if gasto else 'Nuevo gasto' }}</h1>

<form method="post" class="formulario" style="max-width:720px">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

  <fieldset>
    <legend>Datos del gasto</legend>

    <div class="grid-2">
      <label>Fecha *
        <input type="date" name="fecha" required
               value="{{ gasto['fecha'][:10] if gasto else hoy }}">
      </label>
      <label>Categoría *
        <select name="categoria_id" required>
          <option value="">— Seleccionar —</option>
          {% for c in categorias %}
            <option value="{{ c['id'] }}" {% if gasto and gasto['categoria_id'] == c['id'] %}selected{% endif %}>
              {{ c['nombre'] }}
            </option>
          {% endfor %}
        </select>
      </label>
    </div>

    <label>Descripción *
      <input type="text" name="descripcion" required
             placeholder="Ej: Pago de arriendo octubre"
             value="{{ gasto['descripcion'] if gasto else '' }}">
    </label>

    <div class="grid-2">
      <label>Monto *
        <input type="number" step="0.01" name="monto" required min="0.01"
               value="{{ gasto['monto'] if gasto else '' }}">
      </label>
      <label>Forma de pago *
        <select name="forma_pago" required>
          {% set fp = gasto['forma_pago'] if gasto else 'efectivo' %}
          <option value="efectivo" {% if fp == 'efectivo' %}selected{% endif %}>Efectivo</option>
          <option value="nequi" {% if fp == 'nequi' %}selected{% endif %}>Nequi</option>
          <option value="davivienda" {% if fp == 'davivienda' %}selected{% endif %}>Davivienda</option>
          <option value="tarjeta" {% if fp == 'tarjeta' %}selected{% endif %}>Tarjeta</option>
          <option value="transferencia" {% if fp == 'transferencia' %}selected{% endif %}>Transferencia</option>
        </select>
      </label>
    </div>

    <div class="grid-2">
      <label>Proveedor (opcional)
        <select name="proveedor_id">
          <option value="">— Ninguno —</option>
          {% for p in proveedores %}
            <option value="{{ p['id'] }}" {% if gasto and gasto['proveedor_id'] == p['id'] %}selected{% endif %}>
              {{ p['razon_social'] }} ({{ p['nit'] }})
            </option>
          {% endfor %}
        </select>
      </label>
      <label>N° comprobante / factura (opcional)
        <input type="text" name="comprobante"
               value="{{ gasto['comprobante'] if gasto and gasto['comprobante'] else '' }}">
      </label>
    </div>

    <label>Observaciones (opcional)
      <textarea name="observaciones" rows="3">{{ gasto['observaciones'] if gasto and gasto['observaciones'] else '' }}</textarea>
    </label>
  </fieldset>

  <div class="acciones">
    <button type="submit">💾 Guardar</button>
    <a class="boton secundario" href="{{ url_for('contabilidad.gastos_lista') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
