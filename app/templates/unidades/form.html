{% extends "base.html" %}
{% block titulo %}{{ 'Editar unidad' if item else 'Nueva unidad' }}{% endblock %}
{% block contenido %}
<h1>{{ 'Editar unidad · ' + item['nombre'] if item else 'Nueva unidad de medida' }}</h1>

<form method="post" class="formulario">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">

  <fieldset>
    <legend>Datos de la unidad</legend>
    <label>Nombre *
      <input type="text" name="nombre" required autofocus
             value="{{ item['nombre'] if item else '' }}"
             placeholder="Ej: Sello x 10">
    </label>
    <label>Cantidad (unidades base que contiene) *
      <input type="number" step="0.01" name="cantidad" required
             value="{{ item['cantidad'] if item else 1 }}">
    </label>
    <label>Unidad de referencia
      <select name="referencia_id">
        <option value="">— Ninguna (unidad base) —</option>
        {% for r in referencias %}
          {% if not item or r['id'] != item['id'] %}
            <option value="{{ r['id'] }}"
              {% if item and item['referencia_id'] == r['id'] %}selected{% endif %}>
              {{ r['nombre'] }} ({{ r['cantidad'] }})
            </option>
          {% endif %}
        {% endfor %}
      </select>
    </label>
  </fieldset>

  <div class="acciones">
    <button type="submit">{{ 'Guardar cambios' if item else 'Crear unidad' }}</button>
    <a class="boton secundario" href="{{ url_for('unidades.lista') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
