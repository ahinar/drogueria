{% extends "base.html" %}
{% block titulo %}Nuevo usuario{% endblock %}
{% block contenido %}
<div class="tarjeta angosta">
  <h1>Nuevo usuario</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Nombre completo
      <input type="text" name="nombre" required autofocus>
    </label>
    <label>Usuario (letras, números, punto o guion)
      <input type="text" name="usuario" required>
    </label>
    <label>Rol
      <select name="rol" required>
        {% for clave, nombre in ROLES.items() %}<option value="{{ clave }}">{{ nombre }}</option>{% endfor %}
      </select>
    </label>
    <label>Contraseña (mínimo 8 caracteres)
      <input type="password" name="clave" autocomplete="new-password" required>
    </label>
    <label>Repite la contraseña
      <input type="password" name="confirmar" autocomplete="new-password" required>
    </label>
    <button type="submit" class="btn">Crear usuario</button>
    <a href="{{ url_for('admin.usuarios') }}" class="btn-link">Cancelar</a>
  </form>
</div>
{% endblock %}
