<!-- ============ MODAL DE CIERRE DE CAJA ============ -->
<div id="modal-cierre-caja" class="modal-oculto">
  <div class="modal-caja modal-caja-cierre">
    <div class="modal-header">
      <h2>Cierre de caja registradora</h2>
      <span class="cierre-info" id="cierre-n-ordenes">0 órdenes · $ 0</span>
    </div>

    <div class="modal-body">
      <!-- EFECTIVO -->
      <div class="cierre-seccion">
        <div class="cierre-seccion-titulo">
          <span>Efectivo</span>
          <strong id="cierre-efectivo-total">$ 0</strong>
        </div>
        <div class="cierre-linea"><span>Apertura</span><strong id="cierre-efectivo-apertura">$ 0</strong></div>
        <div class="cierre-linea"><span>Ventas del turno</span><strong id="cierre-efectivo-ventas">$ 0</strong></div>
        <div class="cierre-linea"><span>Ingresos</span><strong id="cierre-efectivo-ingresos">+ $ 0</strong></div>
        <div class="cierre-linea"><span>Salidas</span><strong id="cierre-efectivo-salidas">− $ 0</strong></div>
        <div class="cierre-linea cierre-linea-total">
          <span>Efectivo esperado</span>
          <strong id="cierre-efectivo-esperado">$ 0</strong>
        </div>
        <div class="cierre-linea" style="margin-top:.5rem">
          <span>Efectivo contado</span>
          <div style="display:flex;gap:.4rem;align-items:center">
            <!-- Se puede ESCRIBIR el total si ya está contado, o usar "Contar"
                 (billete por billete). Ver pos.js: leerContado() -->
            <input type="text" id="cierre-efectivo-contado" inputmode="numeric" autocomplete="off"
                   style="text-align:right;max-width:140px" value="" placeholder="$ 0"
                   title="Escribe el total contado o usa Contar">
            <button type="button" class="boton secundario" id="btn-contar-cierre-modal"
                    style="padding:.3rem .6rem;font-size:.8rem"><span class="ico-emoji">🧮</span> Contar</button>
          </div>
        </div>
        <div class="cierre-linea cierre-linea-diferencia">
          <span>Diferencia</span>
          <strong id="cierre-efectivo-diferencia">$ 0</strong>
        </div>
      </div>

      <!-- CUENTAS (Nequi, Davivienda, Daviplata...): versión 1.1.14, las pinta static/js/pos.js
           con la lista que manda el servidor (resumen.cuentas), una sección por cuenta -->
      <div id="cierre-cuentas"></div>

      <!-- TARJETA -->
      <div class="cierre-seccion">
        <div class="cierre-seccion-titulo">
          <span>Tarjeta</span>
          <strong id="cierre-tarjeta-total">$ 0</strong>
        </div>
        <div class="cierre-linea"><span>Ventas del turno</span><strong id="cierre-tarjeta-ventas">$ 0</strong></div>
      </div>

      <!-- CRÉDITO: ventas fiadas a clientes de Cartera. No entra plata; solo se informa -->
      <div class="cierre-seccion" id="cierre-credito-seccion" hidden>
        <div class="cierre-seccion-titulo">
          <span>Ventas a crédito (quedan en Cartera)</span>
          <strong id="cierre-credito-total">$ 0</strong>
        </div>
      </div>

      <!-- OBSERVACIONES -->
      <div class="cierre-seccion">
        <div class="cierre-seccion-titulo">
          <span>Nota de cierre</span>
        </div>
        <textarea id="cierre-observaciones" rows="2"
                  placeholder="Agregar una nota de cierre…"
                  style="width:100%;padding:.5rem;border:1px solid #c8d2da;border-radius:.3rem;font-size:.9rem;font-family:inherit"></textarea>
      </div>

      <p id="cierre-error" class="aviso error" style="display:none;margin-top:1rem"></p>
    </div>

    <div class="modal-footer modal-footer-cierre">
      <button type="button" class="boton secundario" id="cierre-descartar">Descartar</button>
      <button type="button" class="boton peligro" id="cierre-confirmar"><span class="ico-emoji">🔒</span> Cerrar caja registradora</button>
    </div>
  </div>
</div>
