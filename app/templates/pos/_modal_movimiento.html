<!-- ============ MODAL DE MOVIMIENTO (ingreso/salida) ============ -->
<div id="modal-movimiento" class="modal-oculto">
  <div class="modal-caja">
    <h2 id="mov-titulo">Movimiento de caja</h2>

    <form id="form-movimiento">
      <input type="hidden" name="tipo" id="mov-tipo" value="ingreso">

      {# Versión 1.1.14: esta ventana se abre desde el botón «Movimiento de plata» del POS, que
         ya preguntó si entra o sale y para qué (gasto y otro ingreso tienen su propia ventana).
         Aquí solo llega el EFECTIVO que entra o sale del cajón sin ser venta, gasto ni ingreso. #}
      <input type="hidden" name="forma_pago" id="mov-forma-pago" value="efectivo">
      <p id="mov-explica" class="mov-ayuda"></p>

      <!-- ¿De dónde viene / a dónde va? Allá también queda registrado (caja menor o Bancos) -->
      <label id="mov-lugar-wrap">
        <span id="mov-lugar-texto">¿A dónde va la plata?</span>
        <select name="lugar" id="mov-lugar">
          <option value="caja_menor">Caja menor</option>
          {% for c in formas_pago.CLAVES_CUENTAS %}<option value="{{ c }}">{{ formas_pago.nombre(c) }}</option>{% endfor %}
          <option value="dueno">El dueño (plata personal)</option>
          <option value="">Otro / no sé</option>
        </select>
      </label>

      <label>Monto *
        <input type="number" step="1" name="monto" id="mov-monto" required autofocus>
      </label>

      <label>Motivo / Observación
        <textarea name="motivo" id="mov-motivo" rows="2"
                  placeholder="Opcional"></textarea>
      </label>

      <p id="mov-error" class="aviso error" style="display:none"></p>
    </form>

    <div class="modal-acciones">
      <button type="button" class="boton secundario" id="mov-cancelar">Cancelar</button>
      <button type="button" class="boton" id="mov-guardar">Guardar</button>
    </div>
  </div>
</div>
