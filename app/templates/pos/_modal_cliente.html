<!-- ============ MODAL DE CLIENTE ============ -->
<div id="modal-cliente" class="modal-oculto">
  <div class="modal-caja">
    <h2>👤 Cliente</h2>
    <label>Nombre
      <input type="text" id="cliente-input-nombre" placeholder="Consumidor final" autocomplete="off">
    </label>
    <label>Documento (opcional)
      <input type="text" id="cliente-input-doc" autocomplete="off">
    </label>
    <div class="modal-acciones">
      <button type="button" class="boton secundario" id="cliente-cancelar">Cancelar</button>
      <button type="button" class="boton" id="cliente-guardar">Guardar</button>
    </div>
  </div>
</div>
